<header class="relative z-40 w-full bg-[#1A1A1A] border-b border-[#2B2B2B] shadow-md">
  <div class="container flex items-center justify-between px-6 py-4 mx-auto">
    <div class="flex items-center gap-8">
      <a href="#" class="text-2xl font-bold tracking-wider text-white">
        Legend<span class="text-[#E53935]">Craft</span>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-[#F5F5F5] font-medium">
        <button class="flex items-center gap-1 hover:text-[#E53935] transition-colors">
          Categorías
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
        <a href="#" class="hover:text-[#E53935] transition-colors">Catálogo</a>
      </nav>
    </div>

    <div class="hidden md:flex flex-1 justify-center px-8">
      <app-search-bar class="w-full max-w-lg"></app-search-bar>
    </div>

    <div class="flex items-center gap-4">
      <app-cart-widget></app-cart-widget>

      <button
        (click)="toggleSidebar()"
        class="p-2 text-[#F5F5F5] hover:text-[#E53935] focus:outline-none md:hidden"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-7 h-7"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>
    </div>
  </div>
</header>

<div
  *ngIf="isSidebarOpen"
  (click)="toggleSidebar()"
  class="fixed inset-0 z-40 bg-black/60 md:hidden transition-opacity"
></div>

<div
  [class.translate-x-0]="isSidebarOpen"
  [class.translate-x-full]="!isSidebarOpen"
  class="fixed top-0 right-0 z-50 flex flex-col w-[90%] h-full bg-[#1A1A1A] shadow-2xl transition-transform duration-300 ease-in-out md:hidden"
>
  <div class="flex items-center justify-between px-6 py-5 border-b border-[#2B2B2B]">
    <span class="text-xl font-bold tracking-wider text-white">Menú</span>
    <button
      (click)="toggleSidebar()"
      class="p-2 text-[#9E9E9E] hover:text-[#E53935] focus:outline-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="flex flex-col flex-1 px-6 py-6 overflow-y-auto gap-8">
    <div class="w-full">
      <app-search-bar></app-search-bar>
    </div>

    <nav class="flex flex-col gap-2 text-[#F5F5F5] text-lg font-medium">
      <a
        href="#"
        class="flex items-center justify-between py-3 border-b border-[#2B2B2B] hover:text-[#E53935] transition-colors"
      >
        Categorías
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </a>
      <a href="#" class="py-3 border-b border-[#2B2B2B] hover:text-[#E53935] transition-colors">
        Catálogo
      </a>
    </nav>
  </div>
</div>
