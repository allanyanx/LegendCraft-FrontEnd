<div
  class="flex flex-col h-full overflow-hidden transition-colors border rounded-lg bg-[#1A1A1A] border-[#2B2B2B] hover:border-[#E53935] group"
>
  <!-- Imagen del Producto -->
  <div class="relative w-full overflow-hidden aspect-4/5 bg-[#2B2B2B]">
    <img
      [src]="articulo().urlImagen"
      [alt]="articulo().nombre"
      class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-105"
    />
    <!-- Etiqueta de Agotado (Solo si el stock es 0) -->
    @if (articulo().stock === 0) {
      <span
        class="absolute px-2 py-1 text-xs font-bold rounded top-2 right-2 bg-black/80 text-[#E53935]"
      >
        Agotado
      </span>
    }
  </div>

  <!-- Detalles del Producto -->
  <div class="flex flex-col flex-1 p-4">
    <h3 class="mb-2 text-lg font-semibold line-clamp-2 text-[#F5F5F5]" [title]="articulo().nombre">
      {{ articulo().nombre }}
    </h3>

    <div class="flex items-center justify-between mt-auto">
      <span class="text-xl font-bold text-[#E53935]"
        >${{ articulo().precio | number: '1.2-2' }}</span
      >

      <!-- Botón Agregar al Carrito -->
      <button
        [disabled]="articulo().stock === 0"
        class="p-2 text-white transition-colors rounded-md bg-[#2B2B2B] hover:bg-[#E53935] disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
  </div>
</div>
