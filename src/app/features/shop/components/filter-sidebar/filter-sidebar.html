<div class="mb-8">
  <h3 class="mb-4 text-lg font-bold border-b border-[#2B2B2B] pb-2">Precio</h3>
  <div class="flex flex-col gap-2 mt-4">
    <input
      type="range"
      min="0"
      max="400"
      class="w-full accent-[#E53935]"
      [value]="precioMaximo()"
      (input)="onPrecioChange.emit($any($event.target).valueAsNumber)"
    />
    <div class="flex justify-between text-sm text-[#9E9E9E]">
      <span>$0</span>
      <span class="font-bold text-[#F5F5F5]">Hasta: ${{ precioMaximo() }}</span>
    </div>
  </div>
</div>

@for (tipo of atributosDisponibles(); track tipo.id) {
  <div class="mb-3 border border-[#2B2B2B] rounded-lg overflow-hidden bg-[#1A1A1A] transition-colors" [class.border-[#E53935]]="activeAccordionId() === tipo.id">
    <button (click)="toggleAccordion(tipo.id)" class="w-full px-4 py-3 text-sm font-bold text-neutral-300 hover:text-white hover:bg-[#252525] bg-[#202020] flex items-center justify-between transition-colors focus:outline-none">
      <div class="flex items-center gap-2">
        <span>{{ tipo.name }}</span>
        @if (getActiveFilterCountForType(tipo) > 0) {
          <span class="px-2 py-0.5 bg-[#E53935]/20 text-[#E53935] text-[10px] rounded-full">{{ getActiveFilterCountForType(tipo) }}</span>
        }
      </div>
      <svg class="w-4 h-4 text-neutral-500 transform transition-transform" [class.rotate-180]="activeAccordionId() === tipo.id" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </button>
    
    @if (activeAccordionId() === tipo.id) {
      <div class="p-3 bg-[#141414] border-t border-[#2B2B2B] flex flex-col gap-2 max-h-56 overflow-y-auto custom-scrollbar">
        @for (valor of tipo.values; track valor.id) {
          <label class="flex items-center gap-3 text-sm cursor-pointer text-[#9E9E9E] hover:text-white transition-colors group">
            <div class="relative flex items-center justify-center w-5 h-5">
              <input
                type="checkbox"
                class="peer appearance-none w-5 h-5 border-2 border-[#3B3B3B] rounded bg-transparent checked:bg-[#E53935] checked:border-[#E53935] transition-all cursor-pointer"
                [checked]="filtrosActivos().has(valor.id)"
                (change)="onFiltroToggle.emit(valor.id)"
              />
              <svg class="absolute w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <span>{{ valor.value }}</span>
          </label>
        }
      </div>
    }
  </div>
}
