<div class="min-h-[80vh] flex items-center justify-center px-4 py-12 text-[#F5F5F5]">
  <div class="w-full max-w-md bg-[#1A1A1A] border border-[#2B2B2B] rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-2">Bienvenido a <span class="text-[#E53935]">LegendCraft</span></h2>
      <p class="text-[#9E9E9E]">Inicia sesión para ver tus pedidos.</p>
    </div>

    @if (error()) {
      <div class="bg-red-500/10 border border-red-500/50 text-red-500 p-3 rounded-md mb-6 text-sm">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-neutral-300 mb-2">Correo Electrónico</label>
        <input
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          class="w-full bg-[#2B2B2B] border border-neutral-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-[#E53935] transition-colors"
          placeholder="tu@correo.com"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-neutral-300 mb-2">Contraseña</label>
        <input
          type="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          class="w-full bg-[#2B2B2B] border border-neutral-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-[#E53935] transition-colors"
          placeholder="••••••••"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-[#E53935] hover:bg-[#C62828] disabled:bg-neutral-600 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center gap-2"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Ingresando...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-[#9E9E9E]">
      ¿No tienes una cuenta? 
      <a routerLink="/auth/register" class="text-white hover:text-[#E53935] font-semibold transition-colors">Regístrate aquí</a>
    </div>
  </div>
</div>
