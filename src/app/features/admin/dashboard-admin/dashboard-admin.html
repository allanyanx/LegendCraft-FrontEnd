<header class="bg-[#0f0f0f] border-b border-neutral-800 px-7 py-4">
  <p class="font-bold text-xl italic text-[#e53935] tracking-wide">Buenos días, Admin :)</p>
</header>

<div class="flex flex-1 h-[calc(100vh-57px)] bg-[#0f0f0f]">
  <aside class="w-48 flex flex-col gap-3 px-4 py-7 border-r border-neutral-800">
    <button
      (click)="mostrarCrear()"
      [class.border-[#e53935]]="seccionActiva === 'crear'"
      [class.text-[#e53935]]="seccionActiva === 'crear'"
      [class.bg-red-950]="seccionActiva === 'crear'"
      class="w-full px-3 py-2 text-left text-sm text-neutral-400 border border-neutral-800 rounded-md hover:border-[#e53935] hover:text-[#e53935] hover:bg-red-950 transition-all"
    >
      + Subir Artículo
    </button>
    <button
      (click)="mostrarEditar()"
      [class.border-[#e53935]]="seccionActiva === 'editar'"
      [class.text-[#e53935]]="seccionActiva === 'editar'"
      [class.bg-red-950]="seccionActiva === 'editar'"
      class="w-full px-3 py-2 text-left text-sm text-neutral-400 border border-neutral-800 rounded-md hover:border-[#e53935] hover:text-[#e53935] hover:bg-red-950 transition-all"
    >
      ✕ Editar/Eliminar
    </button>
  </aside>

  <main class="flex-1 px-8 py-8 overflow-y-auto">
    @if (seccionActiva === 'crear') {
      <section class="max-w-xl">
        <h2
          class="text-xl font-bold text-white tracking-wide mb-6 pb-3 border-b border-neutral-800"
        >
          Crear artículo
        </h2>

        <div class="flex flex-col gap-1 mb-5">
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Foto/Video</label
          >
          <input
            type="file"
            accept="image/*,video/*"
            (change)="onArchivoSeleccionado($event)"
            class="text-sm text-neutral-400 bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 cursor-pointer file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-[#e53935] file:text-white file:text-xs file:cursor-pointer hover:border-[#e53935] transition-colors"
          />
        </div>

        <div class="flex flex-col gap-1 mb-5">
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Nombre</label
          >
          <input
            type="text"
            [(ngModel)]="nuevoArticulo.nombre"
            placeholder="ej: Figura Tartaglia"
            class="bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors"
          />
        </div>

        <div class="flex flex-col gap-1 mb-5">
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Descripción</label
          >
          <textarea
            [(ngModel)]="nuevoArticulo.descripcion"
            placeholder="Describe el artículo..."
            class="bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors resize-y min-h-[90px]"
          ></textarea>
        </div>

        <div class="flex gap-4 mb-5">
          <div class="flex flex-col gap-1 flex-1">
            <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
              >Precio</label
            >
            <input
              type="number"
              [(ngModel)]="nuevoArticulo.precio"
              placeholder="ej: 120.50"
              class="bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors"
            />
          </div>
          <div class="flex flex-col gap-1 flex-1">
            <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
              >Stock</label
            >
            <input
              type="number"
              [(ngModel)]="nuevoArticulo.stock"
              class="bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1 mb-5">
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Categoría</label
          >
          <select
            [(ngModel)]="nuevoArticulo.idCategoria"
            class="bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white outline-none focus:border-[#e53935] transition-colors"
          >
            @for (cat of categorias; track cat.id) {
              <option [value]="cat.id" class="bg-[#1a1a1a]">{{ cat.nombre }}</option>
            }
          </select>
        </div>

        <div class="flex flex-col gap-2 mb-5">
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Atributos</label
          >
          @for (atributo of atributos; track $index) {
            <div class="flex gap-2 items-center">
              <input
                [(ngModel)]="atributo.clave"
                placeholder="ej: franquicia"
                class="flex-1 bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors"
              />
              <input
                [(ngModel)]="atributo.valor"
                placeholder="ej: Genshin Impact"
                class="flex-1 bg-[#1a1a1a] border border-neutral-800 rounded-md px-3 py-2 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#e53935] transition-colors"
              />
              <button
                (click)="eliminarAtributo($index)"
                class="px-3 py-2 text-sm text-neutral-500 border border-neutral-800 rounded-md hover:border-[#e53935] hover:text-[#e53935] transition-all"
              >
                ✕
              </button>
            </div>
          }
          <button
            (click)="agregarAtributo()"
            class="w-full py-2 text-sm text-neutral-500 border border-dashed border-neutral-800 rounded-md hover:border-[#e53935] hover:text-[#e53935] transition-all mt-1"
          >
            + Agregar atributo
          </button>
        </div>

        <div class="flex items-center gap-3 mb-6">
          <input
            type="checkbox"
            [(ngModel)]="nuevoArticulo.estadoActivo"
            class="w-4 h-4 accent-[#e53935] cursor-pointer"
          />
          <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider"
            >Estado activo</label
          >
        </div>

        <button
          (click)="crearArticulo()"
          class="w-full py-3 bg-[#e53935] hover:bg-[#b71c1c] text-white font-bold text-sm tracking-widest rounded-md transition-colors"
        >
          SUBIR
        </button>
      </section>
    }

    @if (seccionActiva === 'editar') {
      <section>
        <h2
          class="text-xl font-bold text-white tracking-wide mb-6 pb-3 border-b border-neutral-800"
        >
          Editar / Eliminar artículo
        </h2>
      </section>
    }
  </main>
</div>
